<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;display:flex;align-items:center}</style></head><body><div style="width:100%;display:grid;gap:12px"><div style="display:flex;gap:16px;align-items:center;font-size:11px"><span style="width:118px;letter-spacing:.1em">--ease-out</span><span style="color:var(--text-secondary)">cubic-bezier(.16,1,.3,1)</span><span style="color:var(--text-muted)">entrances, hover lift</span></div><div style="display:flex;gap:16px;align-items:center;font-size:11px"><span style="width:118px;letter-spacing:.1em">--ease-in-out</span><span style="color:var(--text-secondary)">cubic-bezier(.65,0,.35,1)</span><span style="color:var(--text-muted)">scene transitions</span></div><div style="display:flex;gap:16px;align-items:center;font-size:11px"><span style="width:118px;letter-spacing:.1em">--ease-drag</span><span style="color:var(--text-secondary)">cubic-bezier(.22,.61,.36,1)</span><span style="color:var(--text-muted)">ring / iceberg release</span></div><div style="display:flex;gap:18px;border-top:1px solid var(--border-subtle);padding-top:12px;font-size:10px;letter-spacing:.12em;color:var(--text-muted)"><span>INSTANT 90</span><span>FAST 180</span><span>BASE 320</span><span>SLOW 640</span><span>SCENE 1200</span></div></div></body></html>
