<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;display:flex;align-items:center}</style></head><body><div style="display:flex;gap:18px;width:100%"><div style="flex:1;display:grid;gap:8px"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-xs)"></div><div style="font-size:10px;color:var(--text-muted);letter-spacing:.1em">--RADIUS-XS 2px</div></div><div style="flex:1;display:grid;gap:8px"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div><div style="font-size:10px;color:var(--text-muted);letter-spacing:.1em">--RADIUS-SM 4px</div></div><div style="flex:1;display:grid;gap:8px"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-md)"></div><div style="font-size:10px;color:var(--text-muted);letter-spacing:.1em">--RADIUS-MD 8px</div></div><div style="flex:1;display:grid;gap:8px"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></div><div style="font-size:10px;color:var(--text-muted);letter-spacing:.1em">--RADIUS-LG 14px</div></div><div style="flex:1;display:grid;gap:8px"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-pill)"></div><div style="font-size:10px;color:var(--text-muted);letter-spacing:.1em">--RADIUS-PILL 999px</div></div></div></body></html>
