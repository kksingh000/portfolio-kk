<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;display:flex;align-items:center}</style></head><body><div style="display:flex;gap:20px;width:100%"><div style="flex:1;display:grid;gap:10px"><div style="height:66px;border-radius:var(--radius-md);filter:var(--desaturate-thumb);background:linear-gradient(120deg,#2DD4CF,#5C5C61 55%,#F5F4F0)"></div><div style="font-size:10px;color:var(--text-muted);letter-spacing:.1em">OFF-RING THUMBNAIL</div></div><div style="flex:1;display:grid;gap:10px"><div style="height:66px;border-radius:var(--radius-md);filter:var(--desaturate-photo);background:linear-gradient(120deg,#2DD4CF,#5C5C61 55%,#F5F4F0)"></div><div style="font-size:10px;color:var(--text-muted);letter-spacing:.1em">HERO PHOTO PLANE</div></div><div style="flex:1;display:grid;gap:10px"><div style="height:66px;border-radius:var(--radius-md);filter:none;background:linear-gradient(120deg,#2DD4CF,#5C5C61 55%,#F5F4F0)"></div><div style="font-size:10px;color:var(--text-muted);letter-spacing:.1em">FOCUSED PANEL</div></div></div></body></html>
