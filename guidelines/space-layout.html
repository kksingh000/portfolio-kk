<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;display:flex;align-items:center}</style></head><body><div style="width:100%;border:1px dashed var(--border-strong);padding:var(--space-4)"><div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:var(--space-6)"><div style="height:92px;border:1px solid var(--border-subtle);background:var(--bg-sunken);display:grid;place-items:center;font-size:10px;letter-spacing:.14em;color:var(--text-muted)">NAME</div><div style="height:92px;border:1px solid var(--border-subtle);background:var(--bg-sunken);display:grid;place-items:center;font-size:10px;letter-spacing:.14em;color:var(--text-muted)">PHOTO PLANE</div><div style="height:92px;border:1px solid var(--border-subtle);background:var(--bg-sunken);display:grid;place-items:center;font-size:10px;letter-spacing:.14em;color:var(--text-muted)">STATEMENT</div></div><div style="font-size:10px;color:var(--text-muted);letter-spacing:.14em;margin-top:12px">GAP --SPACE-6 · PAD --PAGE-PAD-X</div></div></body></html>
