<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;display:flex;align-items:center}</style></head><body><div data-theme="deep" style="display:flex;gap:20px;width:100%;background:var(--ink-900);padding:18px;border-radius:var(--radius-lg)"><div style="flex:1;display:grid;gap:10px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--gray-800);box-shadow:var(--glow-sm)"></div><div style="font-size:10px;color:var(--gray-400);letter-spacing:.1em">--GLOW-SM</div></div><div style="flex:1;display:grid;gap:10px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--gray-800);box-shadow:var(--glow-md)"></div><div style="font-size:10px;color:var(--gray-400);letter-spacing:.1em">--GLOW-MD</div></div><div style="flex:1;display:grid;gap:10px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--gray-800);box-shadow:var(--glow-waterline)"></div><div style="font-size:10px;color:var(--gray-400);letter-spacing:.1em">--GLOW-WATERLINE</div></div><div style="flex:1;display:grid;gap:10px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--gray-800);box-shadow:var(--ring-focus)"></div><div style="font-size:10px;color:var(--gray-400);letter-spacing:.1em">--RING-FOCUS</div></div></div></body></html>
